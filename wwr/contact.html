<!-- Rafting Site Project / Contact Us -->

<!Doctype html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="We provide a hand made activities for specialized outdoor activities ">
    <title>Contact Us - Exciting Expeditions</title>
    <meta name="Contact us"
      content="Let us know your ideal experience and what you would expect from us">
    <meta name="author" content="Osiris Frias">
</head>

<body>
    <header>
        <img src="images/z-wwr-oars.png" alt="Rafting Experience Logo">
        <nav>
            <ul>
                <li> <a href="index.html">Home</a></li>
                <li> <a href="about.html">About Us</a></li>
                <li> <a href="trips.html">Trips</a></li>
                <li> <a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-us">
            <h1>White Water Rafting Company</h1>
            <div class="contact-details">
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 999</p>
                <p>info@whitewater.com</p>
            </div>

            <div class="contact-grid">
                <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d56985.672087424755!2d-87.28186294083999!3d20.496567378679803!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2smx!4v1791154578872!5m2!1ses!2smx"
                      width="600" height="450" allowfullscreen="" loading="lazy"
                      referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
                <form class="contact-form">
                    <h2>Send Us a Message</h2>
                    <div class="form-item">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-item">
                        <label for="usermail">Email</label>
                        <input type="email" id="usermail" name="usermail" required>
                    </div>
                    <div class="form-item">
                        <label>Message Purpose</label>
                        <label><input type="radio" id="radio" name="purpose" value="general"
                              checked>
                            General
                            Inquiry</label>
                        <label><input type="radio" id="radio" name="purpose" value="reservation"
                              checked>
                            Reservation
                            Question</label>
                        <label><input type="radio" id="radio" name="purpose" value="suggestion"
                              checked>
                            Website
                            Suggestion</label>
                    </div>
                    <div class="form-item">
                        <label for="feedback">Message</label>
                        <textarea id="feedback" name="feedback" rows="4"
                          placeholder="Type here"></textarea>
                    </div>

                    <div class="form-item checkbox-item">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please suscribe me to the monthly
                            newsletter</label>
                        <button type="submit">Get in Touch!</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="staff">
            <h2>We Are Here to Serve You</h2>
            <div class="profile-gallery">
                <figure>
                    <img src="images/guy1.jpg" alt="Carlos Herrera - Lead Guide">
                    <figcaption> Carlos Herrera</figcaption>
                </figure>
                <figure><img src="images/guy2.jpg" alt="Roberto Santos - Expedition Manager">
                    <figcaption> Roberto Santos </figcaption>
                </figure>
                <figure> <img src="images/guy3.jpg" alt="Eddy Bautista - Safety Specialist">
                    <figcaption> Eddy Bautista</figcaption>
                </figure>

            </div>
        </section>
    </main>
    <footer>
        <p>©️ 2026 ⁜ White Water ⁜ Osiris Frias</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/social_facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/social_linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/social_instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
